name: Fix index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy deploy file to index.html
        run: |
          cp deploy-github-index.html index.html
          rm deploy-github-index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix index.html 18 octobre 2026 12h" || exit 0
          git push
