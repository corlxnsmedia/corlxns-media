name: Fix index temporaire

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fix-index.yml"

permissions:
  contents: write

jobs:
  fix-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Telecharger asset release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download temp-06h-20261019 --repo ${{ github.repository }} --pattern "deploy-github-index.html" --dir /tmp/asset
      - name: Verifier taille et SHA-256
        run: |
          ls -l /tmp/asset/deploy-github-index.html
          stat -c%s /tmp/asset/deploy-github-index.html
          sha256sum /tmp/asset/deploy-github-index.html
          test $(stat -c%s /tmp/asset/deploy-github-index.html) -eq 33559459
          echo "6fafe98704b023ef520651c2fdc92e644563c332195d71c88f50b5ca3fa1bce7  /tmp/asset/deploy-github-index.html" | sha256sum -c -
      - name: Installer index et pousser
        run: |
          cp /tmp/asset/deploy-github-index.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Mizajou 19 octobre 2026 06h"
          git push
