name: Fix index temporaire

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fix-index.yml"

permissions:
  contents: write

jobs:
  fix-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Telecharger asset release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download temp-20h-20261018 --repo ${{ github.repository }} --pattern "index.html" --dir /tmp/asset
      - name: Verifier taille et sha256
        run: |
          ls -l /tmp/asset/index.html
          stat -c%s /tmp/asset/index.html
          sha256sum /tmp/asset/index.html
          test $(stat -c%s /tmp/asset/index.html) -eq 30344132
          echo "af4d7337eade8d3688b59359bc74ded224d284f0b78ca1d55bd00a8c0dbdae8d  /tmp/asset/index.html" | sha256sum -c -
      - name: Installer index et pousser
        run: |
          cp /tmp/asset/index.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Mizajou 18 octobre 2026 20h"
          git push
