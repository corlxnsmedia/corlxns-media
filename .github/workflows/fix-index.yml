name: Fix index temporaire

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fix-index.yml"

permissions:
  contents: write

jobs:
  fix-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Telecharger asset release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download temp-19h-20261018 --repo ${{ github.repository }} --pattern "deploy-github-index.html" --dir /tmp/asset
      - name: Verifier taille et sha256
        run: |
          test $(stat -c%s /tmp/asset/deploy-github-index.html) -eq 29467643
          echo "f140de494c01218ad1a3b8d7142a43f48ea6a83f2c8cff72bc799b71636b59f0  /tmp/asset/deploy-github-index.html" | sha256sum -c -
      - name: Installer index et pousser
        run: |
          cp /tmp/asset/deploy-github-index.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Mizajou 18 octobre 2026 19h"
          git push
